name: daily-report

on:
  schedule:
    - cron: "0 5 * * *"      # каждый день в 05:00 UTC
  workflow_dispatch:          # ручной запуск

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: LFS pull + Generate report
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq git-lfs >/dev/null 2>&1 || true
          git lfs install && git lfs pull 2>/dev/null || true
          gunzip -kf isp_cidr.db.gz || true
          python3 scripts/generate_report.py

      - name: Commit report
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add REPORT.md
          git commit -m "docs: daily report $(date -u +%Y-%m-%d)" || echo "Нет изменений"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
