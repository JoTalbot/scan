name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Сборка статического сайта (отчёты)
        run: |
          mkdir -p site
          # index.html с навигацией по отчётам
          cat > site/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="ru">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>RouterScan — отчёты</title>
            <style>
              body { font-family: system-ui, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 40px 20px; }
              .wrap { max-width: 800px; margin: 0 auto; }
              h1 { color: #58a6ff; }
              a { color: #58a6ff; text-decoration: none; display: block; padding: 12px 16px; margin: 8px 0;
                   background: #161b22; border: 1px solid #30363d; border-radius: 8px; }
              a:hover { border-color: #58a6ff; }
              small { color: #8b949e; }
            </style>
          </head>
          <body>
            <div class="wrap">
              <h1>🌐 RouterScan — отчёты</h1>
              <small>Проект: база CIDR провайдеров + сканирование и аудит роутеров</small>
              <a href="README.html">📖 README</a>
              <a href="REPORT.html">📊 Ежедневный отчёт</a>
              <a href="CVE_PRIORITY.html">🛡️ Приоритизация CVE</a>
              <a href="CVE_REPORT.html">🔍 CVE-отчёт (локальный)</a>
              <a href="internetdb_report.html">🌐 InternetDB отчёт</a>
            </div>
          </body>
          </html>
          HTML
          # конвертация markdown -> html (лёгкий конвертер)
          pip install --quiet markdown 2>/dev/null || true
          python3 - << 'PY'
          import markdown, html, os
          files = ["README.md", "REPORT.md", "CVE_PRIORITY.md", "CVE_REPORT.md", "internetdb_report.md"]
          for f in files:
              if os.path.exists(f):
                  with open(f, encoding="utf-8") as fh:
                      md = fh.read()
                  body = markdown.markdown(md, extensions=["tables", "fenced_code"])
                  out = f"<html><head><meta charset=\"utf-8\"><title>{f}</title>" \
                        f"<style>body{{font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;padding:20px;background:#0d1117;color:#c9d1d9}} " \
                        f"table{{border-collapse:collapse}} td,th{{border:1px solid #30363d;padding:6px 10px}} " \
                        f"a{{color:#58a6ff}} code{{background:#161b22;padding:2px 5px;border-radius:4px}}</style></head>" \
                        f"<body>{body}</body></html>"
                  with open(f"site/{f.replace('.md', '.html')}", "w", encoding="utf-8") as fh:
                      fh.write(out)
                  print("OK:", f)
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
